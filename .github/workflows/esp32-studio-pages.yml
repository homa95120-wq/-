name: ESP32 Studio → GitHub Pages

# Запускается вручную: сначала включи Pages в Settings → Pages → Source: GitHub Actions
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: esp32-web-ide/package-lock.json
      - run: npm ci
        working-directory: esp32-web-ide
      - run: npm run build
        working-directory: esp32-web-ide
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: esp32-web-ide/dist
      - id: deployment
        uses: actions/deploy-pages@v4
