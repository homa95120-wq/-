plugins {
    id 'java'
}

group = 'campaignradar'
version = '1.0'

repositories {
    mavenCentral()
    maven { url = 'https://www.jitpack.io' }
}

dependencies {
    compileOnly 'com.github.Anuken.Mindustry:core:v146'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

jar {
    archiveFileName = 'CampaignThreatRadar.jar'
    from('.') {
        include 'mod.hjson'
    }
}
