name: Build Mod

on: [push, pull_request]

jobs:
  buildJar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Build mod jar
        run: |
          chmod +x ./gradlew
          ./gradlew jar

      - name: Verify jar contents
        run: |
          jar tf build/libs/CampaignThreatRadar.jar
          jar tf build/libs/CampaignThreatRadar.jar | grep -q 'mod.hjson'
          jar tf build/libs/CampaignThreatRadar.jar | grep -q 'campaignradar/CampaignThreatRadar.class'
          unzip -p build/libs/CampaignThreatRadar.jar campaignradar/CampaignThreatRadar.class \
            | head -c 8 | od -An -t u1 \
            | awk '{ if ($8 == 61) print "class file version 61 (Java 17): OK"; else { print "unexpected class version: " $8; exit 1 } }'

      - name: Upload built jar file
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: CampaignThreatRadar
          path: build/libs/CampaignThreatRadar.jar
