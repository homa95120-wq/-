name: ESP32 Studio → Desktop builds

on:
  push:
    branches: [main]
    paths: ['esp32-web-ide/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact: windows
          - os: ubuntu-latest
            script: dist:linux
            artifact: linux
          - os: macos-latest
            script: dist:mac
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: esp32-web-ide/package-lock.json
      - run: npm install --no-audit --no-fund
        working-directory: esp32-web-ide
      - run: npm run ${{ matrix.script }} -- --publish never
        working-directory: esp32-web-ide
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ESP32_STUDIO_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: ESP32-Studio-${{ matrix.artifact }}
          path: |
            esp32-web-ide/release/*.exe
            esp32-web-ide/release/*.AppImage
            esp32-web-ide/release/*.deb
            esp32-web-ide/release/*.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && github.event_name == 'push' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Generate release metadata
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          node -e '
            const fs = require("fs");
            const commit = process.env.GITHUB_SHA || "";
            const meta = {
              version: "1.0.0",
              tag: "esp32-studio-latest",
              commit,
              shortCommit: commit.slice(0, 7),
              publishedAt: new Date().toISOString(),
            };
            fs.mkdirSync("out", { recursive: true });
            fs.writeFileSync("out/esp32-studio-release.json", JSON.stringify(meta, null, 2));
          '
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: esp32-studio-latest
          name: ESP32 Studio (последняя сборка)
          body: |
            Автоматическая сборка ESP32 Studio.
            - Версия: `1.0.0`
            - Сборка (коммит): `${{ github.sha }}`
            - Windows: `ESP32 Studio Setup *.exe` (установщик) или `*-portable.exe` (без установки)
            - Linux: `*.AppImage` / `*.deb`
            - macOS: `*.dmg`
            <!-- esp32-studio-release: {"version":"1.0.0","commit":"${{ github.sha }}","tag":"esp32-studio-latest"} -->
          prerelease: false
          files: out/*
