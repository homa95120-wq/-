name: Release

# Two ways to publish a jar:
#   1. push a tag:            git tag v1.1 && git push origin v1.1
#   2. Actions -> Release -> Run workflow -> enter the tag (e.g. v1.1)
# The jar is attached to the GitHub Release, so it downloads with one click
# and without logging in (unlike Actions artifacts).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.1 (should match version in mod.hjson)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Autopilot logic checks (pure Java, no game needed)
        run: |
          javac -d build/autopilot-check \
            src/main/java/campaignradar/AutopilotLogic.java \
            src/test/java/campaignradar/AutopilotLogicCheck.java
          java -cp build/autopilot-check campaignradar.AutopilotLogicCheck

      - name: Build mod jar
        run: |
          chmod +x ./gradlew
          ./gradlew jar

      - name: Verify jar contents
        run: |
          jar tf build/libs/CampaignThreatRadar.jar
          # -x: the line must match exactly, i.e. mod.hjson sits in the archive
          # root and not inside a wrapper folder.
          jar tf build/libs/CampaignThreatRadar.jar | grep -qx 'mod.hjson'
          jar tf build/libs/CampaignThreatRadar.jar | grep -qx 'campaignradar/CampaignThreatRadar.class'
          unzip -p build/libs/CampaignThreatRadar.jar campaignradar/CampaignThreatRadar.class \
            | head -c 8 | od -An -t u1 \
            | awk '{ if ($8 == 61) print "class file version 61 (Java 17): OK"; else { print "unexpected class version: " $8; exit 1 } }'

      - name: Test and build the script (ZIP) mod
        run: |
          node scriptmod/test-logic.js
          node scriptmod/test-hud.js
          python3 scriptmod/build.py
          python3 - <<'PY'
          import zipfile
          names = zipfile.ZipFile('dist/CampaignThreatRadar.zip').namelist()
          assert names == ['mod.hjson', 'scripts/main.js'], names
          print('zip contents OK:', names)
          PY

      - name: Resolve tag, size and checksum
        id: meta
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$TAG_INPUT"
          else
            tag="$GITHUB_REF_NAME"
          fi
          if [ -z "$tag" ]; then
            echo "::error::No release tag given"
            exit 1
          fi

          jar_path=build/libs/CampaignThreatRadar.jar
          version=$(sed -n 's/^version:[[:space:]]*//p' mod.hjson | head -n1)
          if [ "v$version" != "$tag" ]; then
            echo "::warning::Tag '$tag' does not match version '$version' from mod.hjson"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c %s "$jar_path")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$jar_path" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "zip_size=$(stat -c %s dist/CampaignThreatRadar.zip)" >> "$GITHUB_OUTPUT"
          echo "zip_sha256=$(sha256sum dist/CampaignThreatRadar.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          SIZE: ${{ steps.meta.outputs.size }}
          SHA256: ${{ steps.meta.outputs.sha256 }}
          ZIP_SIZE: ${{ steps.meta.outputs.zip_size }}
          ZIP_SHA256: ${{ steps.meta.outputs.zip_sha256 }}
        run: |
          notes=$(printf '%s\n' \
            'Готовый мод для Mindustry v8 (build 154+). A ready-to-use Mindustry v8 mod.' \
            '' \
            'Два файла, одна и та же логика - ставьте только один из них:' \
            '- `CampaignThreatRadar.jar` - Java-мод, проверенная сборка (рекомендуется);' \
            '- `CampaignThreatRadar.zip` - скриптовая версия (Campaign Threat Radar (ZIP)), Java не нужна.' \
            '' \
            '**Установка / Install**' \
            '- Steam (Windows): `<папка игры>\saves\mods\` - данные Steam-версии лежат в папке установки;' \
            '- Windows: `%APPDATA%\Mindustry\mods\`' \
            '- Linux: `~/.local/share/Mindustry/mods/`' \
            '- macOS: `~/Library/Application Support/Mindustry/mods/`' \
            '' \
            'Или в игре: **Mods → Import file…** → выбрать файл, перезапустить игру и включить мод в списке.' \
            'Не включайте jar и zip одновременно - будет две панели.' \
            '' \
            '**Проверка файла / Verify**' \
            "- jar: \`$SIZE\` байт, SHA-256: \`$SHA256\`" \
            "- zip: \`$ZIP_SIZE\` байт, SHA-256: \`$ZIP_SHA256\`" \
            '' \
            'Windows: `certutil -hashfile <файл> SHA256` · Linux/macOS: `sha256sum <файл>`')

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, replacing the assets."
            gh release upload "$TAG" build/libs/CampaignThreatRadar.jar dist/CampaignThreatRadar.zip --clobber
          else
            gh release create "$TAG" build/libs/CampaignThreatRadar.jar dist/CampaignThreatRadar.zip \
              --target "$GITHUB_SHA" \
              --title "Campaign Threat Radar ${TAG#v}" \
              --notes "$notes" \
              --latest
          fi
