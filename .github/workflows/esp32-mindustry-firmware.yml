name: Mindustry Serpulo (PC + ESP32-S3)

# Собирает и тестирует обе версии проекта esp32s3-mindustry-serpulo:
#   1) Прошивку ESP32-S3 (ESP-IDF 5.3.1, target esp32s3) -> mindustry-esp32s3.bin
#   2) Версию для ПК (Windows x64, Linux x64, macOS):
#      - mindustry-serpulo-pc (SDL2 + OpenGL 3.3 Core)
#      - mindustry-serpulo-web (HTTP + HTML5 Canvas Studio)
#      - headless_runner + автотесты детерминизма simcore (ctest)

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'esp32s3-mindustry-serpulo/**'
      - '.github/workflows/esp32-mindustry-firmware.yml'
  pull_request:
    paths:
      - 'esp32s3-mindustry-serpulo/**'
      - '.github/workflows/esp32-mindustry-firmware.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-esp32s3:
    name: ESP32-S3 Firmware (ESP-IDF 5.3.1)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Static zero-float & zero-heap gate (simcore)
        run: python3 esp32s3-mindustry-serpulo/tools/check_no_float.py

      - name: Build firmware (ESP-IDF 5.3.1, target esp32s3)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.1
          target: esp32s3
          path: esp32s3-mindustry-serpulo/esp-idf
          command: >-
            set -o pipefail;
            { idf.py build &&
            cd build &&
            (esptool.py --chip esp32s3 merge_bin -o mindustry-esp32s3.bin @flash_args ||
            python -m esptool --chip esp32s3 merge_bin -o mindustry-esp32s3.bin @flash_args); }
            2>&1 | tee build-log.txt

      - name: Report build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOG=esp32s3-mindustry-serpulo/esp-idf/build-log.txt
          if [ ! -f "$LOG" ]; then
            echo "::error title=build::build-log.txt not found"
            exit 0
          fi
          echo "----- tail of build log -----"
          tail -80 "$LOG" || true
          grep -n -E "error:|CMake Error|undefined reference|FAILED:|No such file|not found" "$LOG" | head -8 | while IFS= read -r line; do
            echo "::error title=build::$(printf '%s' "$line" | tr '\n%' '  ' | cut -c1-900)"
          done

      - name: Collect ESP32-S3 firmware files
        run: |
          mkdir -p release-esp
          cp esp32s3-mindustry-serpulo/esp-idf/build/mindustry-esp32s3.bin release-esp/
          cp esp32s3-mindustry-serpulo/esp-idf/build/mindustry_serpulo_s3.bin release-esp/ || true
          cp esp32s3-mindustry-serpulo/esp-idf/build/flash_args release-esp/flash_args.txt || true
          if [ -f esp32s3-mindustry-serpulo/micropython/main.py ]; then
            cp esp32s3-mindustry-serpulo/micropython/main.py release-esp/main.py
          fi
          cp esp32s3-mindustry-serpulo/DOWNLOAD.md release-esp/README.md
          ls -lh release-esp

      - name: Upload ESP32-S3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: mindustry-esp32s3-firmware
          path: release-esp/*
          if-no-files-found: error

  build-pc:
    name: PC Build & CTest (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            archive: mindustry-serpulo-pc-linux-x64.zip
          - os: macos-latest
            label: macos
            archive: mindustry-serpulo-pc-macos.zip
          - os: windows-latest
            label: win64
            archive: mindustry-serpulo-pc-win64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Static zero-float & zero-heap gate (simcore)
        shell: bash
        run: |
          if command -v python >/dev/null 2>&1; then
            python esp32s3-mindustry-serpulo/tools/check_no_float.py
          else
            python3 esp32s3-mindustry-serpulo/tools/check_no_float.py
          fi

      - name: Install SDL2 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev

      - name: Install SDL2 (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2

      - name: Download SDL2 VC devel (Windows x64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-devel-2.30.9-VC.zip" -OutFile sdl2.zip
          Expand-Archive -Path sdl2.zip -DestinationPath sdl2-sdk
          $sdlDir = ((Resolve-Path "sdl2-sdk/SDL2-2.30.9/cmake").Path -replace '\\','/')
          echo "SDL2_CMAKE_DIR=$sdlDir" >> $env:GITHUB_ENV
          $sdlDll = ((Resolve-Path "sdl2-sdk/SDL2-2.30.9/lib/x64/SDL2.dll").Path -replace '\\','/')
          echo "SDL2_DLL_PATH=$sdlDll" >> $env:GITHUB_ENV

      - name: Configure & Build PC targets (Unix)
        if: runner.os != 'Windows'
        run: |
          set -o pipefail
          EXTRA_ARGS=""
          if [ "${RUNNER_OS}" = "macOS" ]; then
            EXTRA_ARGS="-DCMAKE_PREFIX_PATH=$(brew --prefix)"
          fi
          { cmake -S esp32s3-mindustry-serpulo -B build-pc -DCMAKE_BUILD_TYPE=Release ${EXTRA_ARGS} &&
            cmake --build build-pc --config Release -j 4 &&
            test -x build-pc/mindustry-serpulo-pc &&
            test -x build-pc/mindustry-serpulo-web &&
            test -x build-pc/headless_runner; } 2>&1 | tee build-pc.log

      - name: Configure & Build PC targets (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -o pipefail
          { cmake -S esp32s3-mindustry-serpulo -B build-pc -A x64 \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
              "-DSDL2_DIR=${SDL2_CMAKE_DIR}" &&
            cmake --build build-pc --config Release --parallel 4 &&
            test -f build-pc/Release/mindustry-serpulo-pc.exe &&
            test -f build-pc/Release/mindustry-serpulo-web.exe &&
            test -f build-pc/Release/headless_runner.exe; } 2>&1 | tee build-pc.log

      - name: Report PC build log on failure
        if: failure()
        shell: bash
        run: |
          if [ -f build-pc.log ]; then
            tail -60 build-pc.log || true
            grep -n -iE "error|fatal|undefined|cannot|missing|failed" build-pc.log | head -12 | while IFS= read -r line; do
              echo "::error title=pc-build-${RUNNER_OS}::$(printf '%s' "$line" | tr '\r\n%' '   ' | cut -c1-800)"
            done
          fi

      - name: Run simcore determinism & protocol CTest suite
        run: ctest --test-dir build-pc -C Release --output-on-failure

      - name: Package PC distribution (${{ matrix.label }})
        shell: bash
        run: |
          mkdir -p dist/web-preview
          cp esp32s3-mindustry-serpulo/web-preview/index.html dist/web-preview/index.html
          cp esp32s3-mindustry-serpulo/DOWNLOAD.md dist/README.md
          cp esp32s3-mindustry-serpulo/LICENSE dist/LICENSE.txt
          if [ "${RUNNER_OS}" = "Windows" ]; then
            cp build-pc/Release/mindustry-serpulo-pc.exe dist/
            cp build-pc/Release/mindustry-serpulo-web.exe dist/
            cp build-pc/Release/headless_runner.exe dist/
            cp "${SDL2_DLL_PATH}" dist/SDL2.dll
          else
            cp build-pc/mindustry-serpulo-pc dist/
            cp build-pc/mindustry-serpulo-web dist/
            cp build-pc/headless_runner dist/
          fi
          ls -lh dist

      - name: Upload PC artifact (${{ matrix.label }})
        uses: actions/upload-artifact@v4
        with:
          name: mindustry-serpulo-pc-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-esp32s3, build-pc]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/') || github.event_name == 'workflow_dispatch') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Collect & upload release assets
        run: |
          find all-artifacts -maxdepth 3
          mkdir -p upload
          ESP_DIR="all-artifacts/mindustry-esp32s3-firmware"
          [ -d "$ESP_DIR/release-esp" ] && ESP_DIR="$ESP_DIR/release-esp"
          cp "$ESP_DIR"/* upload/

          for item in "linux-x64:mindustry-serpulo-pc-linux-x64.zip" "macos:mindustry-serpulo-pc-macos.zip" "win64:mindustry-serpulo-pc-win64.zip"; do
            lbl="${item%%:*}"
            zname="${item##*:}"
            SRC="all-artifacts/mindustry-serpulo-pc-${lbl}"
            [ -d "$SRC/dist" ] && SRC="$SRC/dist"
            chmod +x "$SRC"/mindustry-serpulo-pc "$SRC"/mindustry-serpulo-web "$SRC"/headless_runner 2>/dev/null || true
            (cd "$SRC" && zip -r "$GITHUB_WORKSPACE/upload/${zname}" .)
          done
          ls -lh upload

          NOTES="Единый детерминированный релиз **Mindustry v160.7 (Серпуло)** для **ПК** и **ESP32-S3** (коммит \`${GITHUB_SHA:0:7}\`).

          ### Версия для ПК (SDL2 + OpenGL 3.3 Core и HTTP/Canvas Studio)
          - \`mindustry-serpulo-pc-win64.zip\` — Windows x64 (\`mindustry-serpulo-pc.exe\` + \`SDL2.dll\`, \`mindustry-serpulo-web.exe\`, \`headless_runner.exe\`)
          - \`mindustry-serpulo-pc-linux-x64.zip\` — Linux x64
          - \`mindustry-serpulo-pc-macos.zip\` — macOS

          ### Прошивка для ESP32-S3 (ESP-IDF 5.3.1, N16R8)
          - \`mindustry-esp32s3.bin\` — объединённый образ прошивки (адрес \`0x0\`, Wi-Fi AP \`Mindustry-S3\` \`192.168.4.1:26789\` + UART0 \`115200\`)."

          gh release view esp32-mindustry-fw-latest -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create esp32-mindustry-fw-latest -R "${GITHUB_REPOSITORY}" \
              --prerelease \
              --title "Mindustry v160.7 (Серпуло) — Версия для ПК и ESP32-S3" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA"
          gh release edit esp32-mindustry-fw-latest -R "${GITHUB_REPOSITORY}" \
            --title "Mindustry v160.7 (Серпуло) — Версия для ПК и ESP32-S3" \
            --notes "$NOTES"
          gh release upload esp32-mindustry-fw-latest upload/* -R "${GITHUB_REPOSITORY}" --clobber
