plugins {
    id 'java'
}

group = 'campaignbot'
version = '1.0'

def mindustryVersion = 'v160.7'

repositories {
    mavenCentral()

    ivy {
        name = 'Mindustry releases'
        url = uri('https://github.com/')
        patternLayout {
            artifact '/[organisation]/[module]/releases/download/[revision]/dependencies.jar'
        }
        metadataSources {
            artifact()
        }
        content {
            includeVersion('Anuken', 'Mindustry', mindustryVersion)
        }
    }
}

dependencies {
    compileOnly "Anuken:Mindustry:${mindustryVersion}"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    archiveFileName = 'SerpuloCampaignBot.jar'

    from('.') {
        include 'mod.hjson'
    }
}
